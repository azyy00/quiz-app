<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210">
  <!-- AQuiz wordmark: interlocked A + Q, lowercase "uiz" -->
  <text x="0" y="178" font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="210" font-weight="900" fill="#FFFFFF">A</text>
  <text x="128" y="178" font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="210" font-weight="900" fill="#1E5EFF">Q</text>
  <text x="300" y="178" font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="118" font-weight="900" fill="#1E5EFF">uiz</text>
</svg>
